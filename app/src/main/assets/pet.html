<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DSH Pet</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
            background:transparent;touch-action:none;
            -webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:absolute;inset:0;overflow:hidden;}
  /* canvas 必须显式设 CSS 尺寸：resolution=3.5 时 canvas 真实像素是
     逻辑尺寸的 3.5 倍，不设 CSS 就会被撑大 3.5 倍、只露出左上角 */
  #stage canvas{display:block;width:100% !important;height:100% !important;}
  /* 调试标记已移除 */
  /* ---------- 点击菜单 ---------- */
  #menu{position:absolute;inset:0;display:none;flex-direction:column;
        justify-content:center;padding:10px;box-sizing:border-box;
        background:rgba(12,16,24,.93);border-radius:14px;
        border:1px solid rgba(110,160,255,.35);z-index:20;
        font:12px/1.5 sans-serif;color:#e9eefb;}
  #menu.show{display:flex;}
  #menu .row{margin:5px 0;display:flex;align-items:center;gap:6px;}
  #menu .row label{width:44px;flex:none;color:#9fb6dd;}
  #menu input[type=range]{flex:1;height:18px;accent-color:#6aa8ff;}
  #menu .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  #menu .btns button{flex:1;min-width:64px;padding:7px 4px;border-radius:9px;
        border:1px solid rgba(110,160,255,.45);background:rgba(40,60,100,.75);
        color:#dfe8ff;font-size:12px;}
  #menu .btns button:active{background:rgba(70,110,180,.9);}
  #menu .val{width:44px;text-align:right;color:#7f96bb;font-size:11px;}

  /* ---------- 对话面板 ---------- */
  #chat{position:absolute;left:6px;right:6px;bottom:6px;display:none;
        background:rgba(12,16,24,.95);border-radius:12px;padding:8px;
        border:1px solid rgba(110,160,255,.4);z-index:30;}
  #chat.show{display:block;}
  #chat .log{max-height:120px;overflow-y:auto;margin-bottom:6px;
        font:12px/1.45 sans-serif;color:#dfe8ff;white-space:pre-wrap;}
  #chat .log .me{color:#8fd0ff;}
  #chat .log .ai{color:#b8f0c8;}
  #chat .bar{display:flex;gap:6px;}
  #chat input{flex:1;min-width:0;padding:7px 9px;border-radius:8px;
        border:1px solid rgba(110,160,255,.45);background:rgba(30,42,66,.9);
        color:#eaf1ff;font-size:12px;outline:none;}
  #chat button{padding:7px 12px;border-radius:8px;
        border:1px solid rgba(110,160,255,.5);background:rgba(50,80,140,.9);
        color:#eaf1ff;font-size:12px;}

  #bubble{position:absolute;left:6px;right:6px;bottom:6px;
          background:rgba(16,20,28,.88);color:#e9eefb;
          font:13px/1.45 sans-serif;
          padding:8px 11px;border-radius:12px;
          border:1px solid rgba(110,160,255,.35);
          box-shadow:0 4px 18px rgba(0,0,0,.35);
          opacity:0;transform:translateY(6px);
          transition:opacity .22s ease,transform .22s ease;
          pointer-events:none;white-space:pre-wrap;word-break:break-word;}
  #bubble.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div id="stage"></div>
<div id="menu">
  <div class="row"><label>大小</label>
    <input type="range" id="sizeR" min="120" max="520" step="10">
    <span class="val" id="sizeV">240</span></div>
  <div class="row"><label>透明</label>
    <input type="range" id="alphaR" min="20" max="100" step="5">
    <span class="val" id="alphaV">100%</span></div>
  <div class="btns">
    <button id="btnReact">互动</button>
    <button id="btnChat">对话</button>
    <button id="btnSet">设置</button>
    <button id="btnClose">收起</button>
  </div>
</div>
<div id="chat">
  <div class="log" id="chatLog"></div>
  <div class="bar">
    <input id="chatInput" placeholder="跟我说点什么…">
    <button id="btnSend">发送</button>
  </div>
</div>
<div id="bubble"></div>
<script src="expressions.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/cubism4.min.js"></script>
<script>
(function () {
  var bubble = document.getElementById('bubble');
  var hideTimer = null;

  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { bubble.classList.remove('show'); }, ms || 3500);
  }

  // Android 侧会把 console/加载错误推到这里，直接显示出来
  window.__showError = function (msg) { say('⚠️ ' + msg, 9000); };

  // 未捕获的 JS 异常也显示出来（不然只能干瞪眼）
  window.addEventListener('error', function (e) {
    say('JS 错误: ' + (e.message || '?') + ' @' + (e.lineno || 0), 9000);
  });
  window.addEventListener('unhandledrejection', function (e) {
    say('Promise 失败: ' + (e.reason && e.reason.message || e.reason || '?'), 9000);
  });

  var LINES = [
    '嗯？戳我干嘛~',
    '在的在的 🐋',
    '今天也辛苦了',
    '别熬夜，早点睡哦',
    '要我帮你查余额吗？',
    '有活儿随时喊我',
    '拖着我，我跟你走'
  ];
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  // ---------------- Live2D ----------------
  var app = null, model = null;

  function layout() {
    if (!app || !model) return;
    var w = app.renderer.width, h = app.renderer.height;
    // 关键：Live2DModel 是 PIXI Container，model.width 恒为 0
    // 必须读 internalModel 的尺寸（插件作者的注释里专门提醒过）
    var im = model.internalModel;
    var mw = (im && im.width) || 0;
    var mh = (im && im.height) || 0;
    if (!mw || !mh) { console.warn('[SELFCHECK] internalModel 尺寸为 0:', mw, mh); return; }
    var s = Math.min(w / mw, h / mh);
    model.scale.set(s);
    model.x = (w - mw * s) / 2;
    model.y = h - mh * s;
    console.log('[SELFCHECK] layout ok', mw, mh, 'scale', s.toFixed(3));
    console.log('[SELFCHECK] model pos=', model.x, model.y,
                'alpha=', model.alpha, 'visible=', model.visible,
                'children=', app.stage.children.length);
    console.log('[SELFCHECK] canvas attr=', app.view.width, app.view.height,
                'style=', app.view.style.width, app.view.style.height);
    console.log('[SELFCHECK] renderer=', app.renderer.width, app.renderer.height);
  }

  function boot() {
    if (typeof PIXI === 'undefined' || !PIXI.live2d) {
      say('渲染库没加载起来');
      return;
    }

    // ---- 自检 1：fetch 能不能读到模型 JSON（file:// 时代这里会静默失败）----
    fetch('model/c_0120.model3.json').then(function (r) {
      console.log('[SELFCHECK] fetch status =', r.status);
      return r.text();
    }).then(function (t) {
      console.log('[SELFCHECK] fetch ok, bytes =', t.length);
    }).catch(function (e) {
      console.error('[SELFCHECK] fetch FAILED:', e && e.message || e);
    });
    // 关键：不要用 resizeTo: window —— 悬浮窗的 WebView 初始尺寸可能是 0x0，
    // 那会让 renderer 创建不出来，之后读 .width 直接抛
    // "Cannot read properties of undefined (reading 'width')"
    var W = window.innerWidth || 240;
    var H = window.innerHeight || 400;
    if (W < 32) W = 240;
    if (H < 32) H = 400;
    console.log('[SELFCHECK] viewport =', W, 'x', H);

    app = new PIXI.Application({
      width: W,
      height: H,
      backgroundAlpha: 0,
      antialias: true,
      autoStart: true,
      resolution: 1
    });
    document.getElementById('stage').appendChild(app.view);

    // 必须注册 Ticker，否则模型不会更新（画面永远空白）
    var Live2DModel = PIXI.live2d.Live2DModel;
    Live2DModel.registerTicker(PIXI.Ticker);

    Live2DModel.from('model/c_0120.model3.json', {
      autoInteract: false,
      autoUpdate: true,
      idleMotionGroup: 'idle'
    }).then(function (m) {
      model = m;
      model.eventMode = 'none';
      model.alpha = 1;
      console.log('[SELFCHECK] model raw scale=', model.scale.x, 'alpha=', model.alpha);
      app.stage.addChild(model);
      console.log('[SELFCHECK] model added to stage');
      // 取 coreModel 并挂 rig（与插件作者同一挂载点）
      try {
        coreModel = model.internalModel.coreModel;
        model.internalModel.on('beforeModelUpdate', applyRig);
      } catch (e) { /* 挂不上就只播动作，其余功能不受影响 */ }
      layout();
      window.addEventListener('resize', layout);
      say('🐋 我在这儿~', 2200);
      setTimeout(function () { react(); }, 900);
    }).catch(function (e) {
      var msg = (e && e.message) || String(e);
      var stack = (e && e.stack) ? String(e.stack).split('\n').slice(0, 3).join(' | ') : '';
      console.error('[SELFCHECK] model load FAILED:', msg, stack);
      say('模型加载失败：' + msg + (stack ? '\n' + stack : ''), 20000);
    });
  }

  // ---------------- 活人感：动作 & 表情 ----------------
  // 动作名必须用 model3.json 里注册的英文组名，不是磁盘文件名：
  //   喷水=splash / 开盖=openLid / 番茄酱=ketchup / 自拍=selfie / 自拍简单=selfieQuick
  var MOTIONS = ['splash', 'openLid', 'ketchup', 'selfie', 'selfieQuick', 'bubble', 'aidale'];

  // ---- 表情 rig ----
  // 这 44 个「表情」没在 model3.json 里注册，是 VTube Studio 的参数开关（多为 Add 混合）。
  // 关键：pixi-live2d-display 每帧会 saveParameters() 存快照、结尾再 loadParameters() 装回来，
  // 所以直接写参数会被覆盖 —— 必须挂在 beforeModelUpdate（coreModel.update() 之前最后一站）。
  var EXPR = window.EXPR || {};
  var FACE = [], PROPS = [];
  (function () {
    for (var k in EXPR) {
      var allParam = true;
      for (var i = 0; i < EXPR[k].length; i++) {
        if (!/^Param/.test(EXPR[k][i][0])) { allParam = false; break; }
      }
      (allParam ? FACE : PROPS).push(k);
    }
  })();

  var coreModel = null;
  var curExpr = null, exprW = 0, exprTarget = 0, lastT = 0, exprTimer = null;

  function setExpression(name, ms) {
    if (!coreModel || !EXPR[name]) return;
    curExpr = EXPR[name];
    exprTarget = 1;
    clearTimeout(exprTimer);
    exprTimer = setTimeout(function () { exprTarget = 0; }, ms || 4000);
  }

  function applyRig() {
    if (!coreModel || !curExpr) return;
    var now = performance.now();
    var dt = Math.min(64, now - (lastT || now)) / 1000;
    lastT = now;

    var speed = exprTarget > exprW ? 7 : 11;   // 进得慢退得快，像变脸不像硬切
    exprW += (exprTarget - exprW) * Math.min(1, dt * speed);
    if (exprTarget === 0 && exprW < 0.02) { curExpr = null; exprW = 0; return; }

    for (var i = 0; i < curExpr.length; i++) {
      var id = curExpr[i][0], val = curExpr[i][1], blend = curExpr[i][2];
      try {
        var idx = coreModel.getParameterIndex(id);
        if (idx < 0) continue;                  // 模型没这个参数，跳过
        var base = coreModel.getParameterValueByIndex(idx);
        var out = (blend === 'Add') ? (base + val * exprW)
                                    : (base * (1 - exprW) + val * exprW);
        coreModel.setParameterValueByIndex(idx, out);
      } catch (e) { /* 单个参数失败不影响其它 */ }
    }
  }

  function react() {
    if (!model) return;
    var m = MOTIONS[Math.floor(Math.random() * MOTIONS.length)];
    try { model.motion(m); } catch (e) { /* 名字对不上就跳过 */ }
    var pool = FACE.length ? FACE : PROPS;
    if (pool.length) setExpression(pool[Math.floor(Math.random() * pool.length)], 4000);
  }

  // ---------------- 余额 ----------------
  function refreshBalance(silentWhenOk) {
    if (typeof DshPet === 'undefined') { say('没连上 App'); return; }
    var raw;
    try { raw = DshPet.balance(); }
    catch (e) { say('调用失败：' + e); return; }

    var d;
    try { d = JSON.parse(raw); }
    catch (e) { say('返回异常：' + raw); return; }

    if (d.error) {
      if (d.error === 'no_key') say('还没填 DeepSeek API Key\n点我 → 打开设置', 5000);
      else say('余额查询失败（' + d.error + '）', 4000);
      return;
    }
    var b = (d.balance_infos || [])[0] || {};
    var total = parseFloat(b.total_balance || 0).toFixed(2);
    var grant = parseFloat(b.granted_balance || 0).toFixed(2);
    var top = parseFloat(b.topped_up_balance || 0).toFixed(2);
    say('💰 余额 ¥' + total + '\n赠送 ¥' + grant + ' · 充值 ¥' + top, 6000);
  }

  // ---------------- 菜单 ----------------
  var menuEl = document.getElementById('menu');
  var chatEl = document.getElementById('chat');
  var sizeR = document.getElementById('sizeR');
  var alphaR = document.getElementById('alphaR');
  var sizeV = document.getElementById('sizeV');
  var alphaV = document.getElementById('alphaV');

  function openMenu() {
    menuEl.classList.add('show');
    chatEl.classList.remove('show');
    try {
      var c = JSON.parse(DshPet.getConfig());
      sizeR.value = c.w;
      sizeV.textContent = c.w;
      var a = Math.round((c.alpha || 1) * 100);
      alphaR.value = a;
      alphaV.textContent = a + '%';
    } catch (e) {}
  }

  function closeMenu() {
    menuEl.classList.remove('show');
    if (typeof DshPet !== 'undefined' && DshPet.setFocusable) DshPet.setFocusable(false);
  }

  // 拖动滑块：改窗口大小（高度按 5:3 比例跟随）
  sizeR.addEventListener('input', function () {
    var w = parseInt(sizeR.value, 10);
    sizeV.textContent = w;
    var h = Math.round(w * 5 / 3);
    try { DshPet.setSize(w, h); } catch (e) {}
  });

  // 拖动滑块：改透明度
  alphaR.addEventListener('input', function () {
    var a = parseInt(alphaR.value, 10);
    alphaV.textContent = a + '%';
    try { DshPet.setAlpha(a / 100); } catch (e) {}
  });

  document.getElementById('btnReact').onclick = function () { react(); };

  document.getElementById('btnSet').onclick = function () {
    if (DshPet.openSettings) DshPet.openSettings();
  };

  document.getElementById('btnClose').onclick = function () { closeMenu(); };

  document.getElementById('btnChat').onclick = function () {
    menuEl.classList.remove('show');
    chatEl.classList.add('show');
    // 需要输入框能拿焦点，否则键盘弹不出来
    try { DshPet.setFocusable(true); } catch (e) {}
    setTimeout(function () {
      try { document.getElementById('chatInput').focus(); } catch (e) {}
    }, 120);
  };

  // ---------------- 点击入口 ----------------
  window.onPetClick = function () {
    if (chatEl.classList.contains('show')) { closeChat(); return; }
    if (menuEl.classList.contains('show')) { closeMenu(); return; }
    openMenu();
  };

  // ---------------- 对话（先接 DeepSeek API，后续换 DSH）----------------
  var chatLog = document.getElementById('chatLog');
  var chatInput = document.getElementById('chatInput');

  function logLine(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function closeChat() {
    chatEl.classList.remove('show');
    try { DshPet.setFocusable(false); } catch (e) {}
  }

  var sending = false;
  function sendChat() {
    var text = (chatInput.value || '').trim();
    if (!text || sending) return;
    logLine('me', '我：' + text);
    chatInput.value = '';
    sending = true;
    logLine('ai', '鲸鱼娘：…');
    var last = chatLog.lastChild;
    var raw = '';
    try {
      raw = DshPet.ask(text);
    } catch (e) {
      raw = '调用失败：' + e;
    }
    var d = null;
    try { d = JSON.parse(raw); } catch (e) {}
    if (d && d.reply) {
      last.textContent = '鲸鱼娘：' + d.reply;
    } else {
      last.textContent = '鲸鱼娘：' + (d && d.error ? '（' + d.error + '）' : raw);
    }
    sending = false;
  }

  document.getElementById('btnSend').onclick = sendChat;
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendChat();
  });

  // 调试用
  window.refreshBalance = refreshBalance;
  window.say = say;

  boot();
  setTimeout(function () { refreshBalance(true); }, 1800);
  setInterval(function () { refreshBalance(true); }, 300000);

  // 没人理她的时候，自己也动一动
  (function idleLoop() {
    var wait = 20000 + Math.random() * 20000;
    setTimeout(function () { react(); idleLoop(); }, wait);
  })();
})();
</script>
</body>
</html>
